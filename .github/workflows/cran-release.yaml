on:
  workflow_dispatch:

name: CRAN release check

permissions: read-all

jobs:
  cran-release-check:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Refresh system package metadata
        run: sudo apt-get update

      - name: Install HTML Tidy
        run: sudo apt-get install -y tidy

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::devtools
          needs: check

      - name: Build source package
        run: R CMD build .

      - name: Run CRAN-style check
        run: R CMD check --as-cran DataSum_*.tar.gz

      - name: Upload source package and check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datasum-cran-release-artifacts
          path: |
            DataSum_*.tar.gz
            DataSum.Rcheck
